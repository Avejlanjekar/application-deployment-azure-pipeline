
trigger: none

pool:
  name: Default

parameters:
  - name: Environment
    type: string
    default: dev
    displayName: select Env for deployment
    values:
      - dev
      - qa
      - uat
      - prod
  
  - name: imageTag
    type: string
    displayName: select Tag to promote
    default: "latest"

variables:
  buildContext: './db'
  dockerHubUsername: 'avejlanjekar45'


stages:
  - stage: Build_And_Push_Dev
    displayName: 'Build and push database docker image to dev'
    condition: eq('${{ parameters.Environment }}','dev')
    jobs:
      - job: Build_And_Push_Dev
        displayName: 'Build and push database docker image to dev'
        steps:
          - checkout: self
          - task: Docker@2
            displayName: 'Build and push DB docker image'
            inputs:
              containerRegistry: 'dockerhub-service-connection'
              repository: 'avejlanjekar45/employee-management-database-dev'
              command: buildAndPush
              Dockerfile: '$(buildContext)/Dockerfile'
              buildContext: '$(buildContext)'
              tags: |
                $(Build.SourceVersion)

  - stage: Validate_Helm_Dev
    displayName: 'Validate Helm chart for Dev'
    condition: eq('${{ parameters.Environment }}', 'dev')
    dependsOn: []
    jobs:
      - job: ValidateChart
        displayName: 'Lint and render Helm chart'
        steps:
          - checkout: self
          - script: |
              set -e

              echo "Step 1: Lint Helm chart"
              helm lint ./helm/employee-management -f ./helm/employee-management/values-dev.yaml

              echo "Step 2: Render Helm templates"
              helm template employee-management ./helm/employee-management --namespace employee-dev -f ./helm/employee-management/values-dev.yaml
            displayName: 'Validate Helm chart'

  - stage: Promote_Dev_To_QA
    displayName: 'QA - Promote database image'
    dependsOn: []
    condition: eq('${{ parameters.Environment }}', 'qa')
    jobs:
      - job: 'PromoteQA'
        displayName: 'QA - Promote database image'
        steps:
          - checkout: none
          - task: Docker@2
            displayName: 'login to docker hub'
            inputs:
              command: 'login'
              containerRegistry: 'dockerhub-service-connection'
          - script: |
              set -e

              if [ -z "${{ parameters.imageTag }}" ]; then
                echo "ERROR: image tag is required for promotion"
                exit 1
              fi 

              docker pull $(dockerHubUsername)/employee-management-database-dev:${{ parameters.imageTag }}
              docker tag $(dockerHubUsername)/employee-management-database-dev:${{ parameters.imageTag }} $(dockerHubUsername)/employee-management-database-qa:${{ parameters.imageTag }}
              docker push $(dockerHubUsername)/employee-management-database-qa:${{ parameters.imageTag }}
            displayName: "QA - Promote database image"

  - stage: Promote_QA_to_UAT
    displayName: 'UAT - Promote database image'
    dependsOn: []
    condition: eq('${{ parameters.Environment }}','uat')
    jobs:
      - job: PromoteUAT
        displayName: 'UAT - Promote database image'
        steps:
          - checkout: none
          - task: Docker@2
            displayName: 'login to docker hub'
            inputs:
              command: 'login'
              containerRegistry: 'dockerhub-service-connection'
          - script: |
              set -e 

              if [ -z "${{ parameters.imageTag }}" ]; then
                echo "ERROR: image tag is required for promotion"
                exit 1
              fi 

              docker pull $(dockerHubUsername)/employee-management-database-qa:${{ parameters.imageTag }}
              docker tag $(dockerHubUsername)/employee-management-database-qa:${{ parameters.imageTag }} $(dockerHubUsername)/employee-management-database-uat:${{ parameters.imageTag }}
              docker push $(dockerHubUsername)/employee-management-database-uat:${{ parameters.imageTag }}
            displayName: 'UAT - Promote database image'

  - stage: Approve_Production
    displayName: 'Production - Manual Approval'
    dependsOn: []
    condition: eq('${{ parameters.Environment }}', 'prod')
    jobs:
      - job: WaitForApproval
        displayName: 'Approve Production promotion'
        pool: server
        timeoutInMinutes: 1440
        steps:
          - task: ManualValidation@1
            timeoutInMinutes: 1440
            inputs:
              notifyUsers: ""
              approvers: ""
              allowApproversToApproveTheirOwnRuns: false
              instructions: 'Review the UAT database image and approve promotion to production.'
              onTimeout: reject

  - stage: Promote_UAT_to_PROD
    displayName: 'promote uat to prod'
    dependsOn: [Approve_Production]
    condition: and(succeeded(),eq('${{ parameters.Environment }}','prod'))
    jobs:
      - job: PromotePROD
        displayName: 'promote uat to prod'
        steps:
          - checkout: none 
          - task: Docker@2
            displayName: 'login to docker hub'
            inputs:
              command: 'login'
              containerRegistry: 'dockerhub-service-connection'
          - script: |
              set -e 

              if [ -z "${{ parameters.imageTag }}" ]; then
                echo "ERROR: image tag is required for promotion"
                exit 1
              fi 

              docker pull $(dockerHubUsername)/employee-management-database-uat:${{ parameters.imageTag }}
              docker tag $(dockerHubUsername)/employee-management-database-uat:${{ parameters.imageTag }} $(dockerHubUsername)/employee-management-database-prod:${{ parameters.imageTag }}
              docker push $(dockerHubUsername)/employee-management-database-prod:${{ parameters.imageTag }}
            displayName: 'promote uat to prod'
